[project]
name = "langgraph-ai-platform"
version = "0.1.0"
description = "On-prem LangGraph AI platform using Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.3.10",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
