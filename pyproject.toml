[project]
name = "langgraph-ai-platform"
version = "0.3.0"
description = "On-prem standalone LangGraph service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2.0",
    "starlette>=0.46.0",
    "uvicorn>=0.34.0",
]

[tool.setuptools.packages.find]
include = ["langgraph_service*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
